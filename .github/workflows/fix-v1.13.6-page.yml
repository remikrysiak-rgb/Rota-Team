name: Fix Rota Team v1.13.6 page versions

on:
  push:
    paths:
      - '.github/workflows/fix-v1.13.6-page.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Normalize all visible 1.13.x version strings
        run: |
          sed -Ei 's/1\.13\.[0-9]+/1.13.6/g' index.html
          grep -q 'v1.13.6' index.html
          ! grep -Eq '1\.13\.[0-5]' index.html
      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/fix-v1.13.6-page.yml
          git config user.name 'Rota Team Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/fix-v1.13.6-page.yml
          git commit -m 'Normalize public page to Rota Team v1.13.6'
          git push
