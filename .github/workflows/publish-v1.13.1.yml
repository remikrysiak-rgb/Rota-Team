name: Publish Rota Team v1.13.1

on:
  push:
    paths:
      - '.github/workflows/publish-v1.13.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download tested v1.13.1 artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-fe14-81f4-b528-2e587a9a00c8/raw?se=2026-09-03T20%3A09%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=783b179e-863f-515f-813d-6526d5d47591&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T22%3A23%3A25Z&ske=2026-09-03T22%3A23%3A25Z&sks=b&skv=2026-02-06&sig=ImnFrtrRVK%2BblYiXU2uUwcznJ0KVOvNEq7T0m1vTd4k%3D' -o artifact.zip
          unzip -q artifact.zip -d artifact
          test -f artifact/RotaTeam-v1.13.1.apk
          cp artifact/RotaTeam-v1.13.1.apk RotaTeam.apk
          echo '7221a0757d632261e33b33c6a391d25e13d76f9f5f8868000a48b56b7e402080  RotaTeam.apk' | sha256sum -c -
      - name: Update public version metadata and page
        run: |
          cat > update.json <<'EOF'
          {
            "versionCode": 37,
            "versionName": "1.13.1",
            "apkUrl": "https://remikrysiak-rgb.github.io/Rota-Team/RotaTeam.apk",
            "sha256": "7221a0757d632261e33b33c6a391d25e13d76f9f5f8868000a48b56b7e402080",
            "notes": "Nowość / New / Nou / नया / Nauja: wszystkie główne ustawienia wypłaty od razu przeliczają wynik; edytowalna pensja roczna, pension 0%, Fire Aid / Fire Marshal i First Aid."
          }
          EOF
          sed -i 's/v1\.13\.0/v1.13.1/g; s/wersję 1\.13\.0/wersję 1.13.1/g; s/version 1\.13\.0/version 1.13.1/g; s/versiunea 1\.13\.0/versiunea 1.13.1/g; s/संस्करण 1\.13\.0/संस्करण 1.13.1/g; s/versiją 1\.13\.0/versiją 1.13.1/g' index.html
      - name: Publish and remove one-time workflow
        run: |
          rm -f .github/workflows/publish-v1.13.1.yml
          git config user.name 'Rota Team Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add RotaTeam.apk update.json index.html .github/workflows/publish-v1.13.1.yml
          git commit -m 'Publish Rota Team v1.13.1 as current public version'
          git push
