name: Publish Rota Team v1.13.6

on:
  push:
    paths:
      - '.github/workflows/publish-v1.13.6.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download tested v1.13.6 artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntprukwest.oaiusercontent.com/files/00000000-5928-8243-8ae1-1ddb95859794/raw?se=2026-09-04T23%3A11%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=d7eb0ba0-48cb-5d53-bd43-c35120715812&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T22%3A16%3A06Z&ske=2026-09-05T22%3A16%3A06Z&sks=b&skv=2026-02-06&sig=ubFa8s4kN1ADVhnQ5g9qBmw9M4m%2BAamc%2BgQbbwk9d0I%3D' -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/RotaTeam-v1.13.6.apk
          cp artifact/RotaTeam-v1.13.6.apk RotaTeam.apk
          echo '14e9ca9c9c48e280e60911414d534546cd4ce84666d742ca47270df10a4ca312  RotaTeam.apk' | sha256sum -c -
      - name: Update public metadata and page
        run: |
          cat > update.json <<'EOF'
          {
            "versionCode": 42,
            "versionName": "1.13.6",
            "apkUrl": "https://remikrysiak-rgb.github.io/Rota-Team/RotaTeam.apk",
            "sha256": "14e9ca9c9c48e280e60911414d534546cd4ce84666d742ca47270df10a4ca312",
            "notes": "Nowość / New / Nou / नया / Nauja: poprawione skalowanie widżetu na Samsung Fold i dużych ekranach; na standardowych telefonach wygląd widżetu pozostaje bez zmian."
          }
          EOF
          sed -i 's/v1\.13\.5/v1.13.6/g; s/1\.13\.5/1.13.6/g' index.html
      - name: Publish and remove one-time workflow
        run: |
          rm -f .github/workflows/publish-v1.13.6.yml
          git config user.name 'Rota Team Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add RotaTeam.apk update.json index.html .github/workflows/publish-v1.13.6.yml
          git commit -m 'Publish Rota Team v1.13.6 as current public version'
          git push
