name: Publish RotaTeam v1.13.49 publicly
on:
  push:
    paths:
      - '.github/workflows/publish-v1.13.49.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Obtain and verify signed v1.13.49 APK from private tested build
        env:
          VERIFIED_BUILD_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-c958-8210-a453-28ecfb1bf621/raw?se=2026-11-21T20%3A59%3A03Z&sp=r&sv=2026-06-06&sr=b&scid=a13b3b5b-64c5-56e6-b018-1c8839f27fdf&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-21T08%3A36%3A32Z&ske=2026-11-22T08%3A36%3A32Z&sks=b&skv=2026-06-06&sig=y3woM5i4GyvzjnyxE9y0RocQpCj3NmpAlWYOQqju5lc%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 "$VERIFIED_BUILD_URL" -o /tmp/rt149-build.zip
          mkdir -p /tmp/rt149
          unzip -q /tmp/rt149-build.zip 'RotaTeam-v1.13.49-test.apk' -d /tmp/rt149
          echo '934eb24980c1890bd4679aff9ab6b8cf651ca91b77c8dda29931be4b12b05af2  /tmp/rt149/RotaTeam-v1.13.49-test.apk' | sha256sum -c -
          cp /tmp/rt149/RotaTeam-v1.13.49-test.apk RotaTeam.apk
          test "$(stat -c%s RotaTeam.apk)" = 1405599
          SDK_BIN="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$SDK_BIN/apksigner" verify --print-certs RotaTeam.apk | grep -qi '0aca0441c83238d5cee81efe8dfa43d8b7bc33edd1cc05e31607d51569b0e595'
          "$SDK_BIN/aapt" dump badging RotaTeam.apk | grep -q "versionCode='85' versionName='1.13.49'"
          ! "$SDK_BIN/aapt" dump permissions RotaTeam.apk | grep -q 'REQUEST_INSTALL_PACKAGES'
      - name: Update existing site and app update feed without changing URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          sha='934eb24980c1890bd4679aff9ab6b8cf651ca91b77c8dda29931be4b12b05af2'
          feed=Path('update.json')
          obj=json.loads(feed.read_text(encoding='utf-8'))
          assert obj.get('versionName')=='1.13.48' and obj.get('versionCode')==84, 'Unexpected current public release'
          assert obj.get('apkUrl')=='https://remikrysiak-rgb.github.io/Rota-Team/RotaTeam.apk'
          obj.update({
            'versionCode':85,
            'versionName':'1.13.49',
            'sha256':sha,
            'notes':'PL: Kompaktowe formatowanie ekranu głównego: mniejszy nagłówek, prognoza i OFF TASK, na wzór starszej wersji. Zachowane wszystkie motywy, przypomnienia, osobny alarm po 15 minutach i 540 opisów świąt. EN: Compact home layout with original themes, OFF TASK reminders and alarm, and all holiday details unchanged.'
          })
          feed.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          page=Path('index.html')
          html=page.read_text(encoding='utf-8')
          assert '1.13.48' in html and 'href="RotaTeam.apk"' in html
          html=html.replace('1.13.48','1.13.49')
          page.write_text(html,encoding='utf-8')
          readme=Path('README.md')
          text=readme.read_text(encoding='utf-8')
          assert 'Current public version: 1.13.48' in text
          readme.write_text(text.replace('Current public version: 1.13.48','Current public version: 1.13.49'),encoding='utf-8')
          Path('RotaTeam.apk.sha256').write_text(sha+'  RotaTeam.apk\n',encoding='ascii')
          PY
      - name: Validate stable public files before publishing
        run: |
          set -euo pipefail
          echo '934eb24980c1890bd4679aff9ab6b8cf651ca91b77c8dda29931be4b12b05af2  RotaTeam.apk' | sha256sum -c -
          grep -Fq '"versionCode": 85' update.json
          grep -Fq '"versionName": "1.13.49"' update.json
          grep -Fq 'Current public version: 1.13.49' README.md
          grep -Fq '1.13.49' index.html
          grep -Fq 'href="RotaTeam.apk"' index.html
      - name: Replace APK at existing download address
        run: |
          set -euo pipefail
          git config user.name 'Rota Team Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add RotaTeam.apk RotaTeam.apk.sha256 update.json index.html README.md
          git commit -m 'Publish signed v1.13.49 with original OFF TASK layout restored'
          git push origin HEAD:main
      - name: Publish new latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat >/tmp/rt149-release-notes.txt <<'EOF'
          RotaTeam v1.13.49 — kompaktowy ekran główny
          - Mniejsze teksty i odstępy w nagłówku, pogodzie oraz sekcji OFF TASK.
          - Przywrócono proporcje logo i kafelka BREAK bliższe starszej wersji.
          - Kolory użytkownika, przycisk START OFF TASK, przypomnienia i niezależny 15-minutowy alarm bez zmian.
          - Zachowane pełne opisy 540 świąt w pięciu językach.
          - APK podpisany tym samym certyfikatem; aktualizacja bez odinstalowania.
          EOF
          if gh release view v1.13.49 >/dev/null 2>&1; then
            gh release upload v1.13.49 RotaTeam.apk RotaTeam.apk.sha256 --clobber
          else
            gh release create v1.13.49 RotaTeam.apk RotaTeam.apk.sha256 --title 'RotaTeam v1.13.49' --notes-file /tmp/rt149-release-notes.txt --latest
          fi
